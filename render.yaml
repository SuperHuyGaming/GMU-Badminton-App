services:
  # ============================================
  # PRODUCTION (deploys from 'main' branch)
  # ============================================

  # 1. Production Backend (Node.js)
  - type: web
    name: gmu-social-api
    env: node
    rootDir: server
    branch: main
    buildCommand: npm install --legacy-peer-deps
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: NODE_ENV
        value: production

  # 2. Production Frontend (Static)
  - type: web
    name: gmu-frontend
    env: static
    rootDir: client
    branch: main
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: gmu-social-api
          type: web
          property: host

  # ============================================
  # STAGING: Create manually on Render (free tier)
  # See docs/STAGING_SETUP.md for instructions
  # ============================================
