[project]
name = "scraper-service"
version = "1.0.0"
description = "Autonomous scraper and AI extraction service for collegiate badminton tournaments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "instructor>=1.3.0",
    "openai>=1.30.0",
    "tenacity>=8.3.0",
    "beautifulsoup4>=4.12.3",
    "instaloader>=4.13.0",
    "apify-client>=1.7.0",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "DTZ003", "DTZ005", "TRY201", "UP006", "UP035"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

