<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#006633" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>Mason Badminton Connect</title>
    <style>
      /* Splash Screen Styles */
      body, html {
        margin: 0; padding: 0; width: 100%; min-height: 100vh;
        background-color: #02120a;
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      }
      #splash {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        width: 100%; height: 100vh;
        color: white;
      }
      .shuttle {
        width: 100px; height: 100px;
        animation: float 2s ease-in-out infinite;
        filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4));
      }
      .brand-title {
        margin-top: 32px;
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #ffffff;
        opacity: 0;
        animation: fadeIn 1s ease-out forwards 0.3s;
      }
      .brand-subtitle {
        font-size: 16px;
        color: #FFCC33;
        margin-top: 8px;
        font-weight: 700;
        letter-spacing: 4px;
        opacity: 0;
        animation: fadeIn 1s ease-out forwards 0.6s;
      }
      .loader {
        margin-top: 48px;
        width: 150px; height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
        opacity: 0;
        animation: fadeIn 1s ease-out forwards 0.9s;
      }
      .loader-bar {
        width: 40%; height: 100%;
        background: #FFCC33;
        border-radius: 4px;
        animation: loading 1.5s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
      }
      @keyframes fadeIn {
        to { opacity: 1; transform: translateY(0); }
        from { opacity: 0; transform: translateY(10px); }
      }
      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <!-- Minimalistic Shuttlecock SVG Logo -->
        <svg class="shuttle" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 95 C 35 95 30 75 30 65 L 10 20 C 15 10 85 10 90 20 L 70 65 C 70 75 65 95 50 95 Z" fill="#ffffff"/>
          <path d="M30 65 C 40 70 60 70 70 65" stroke="#004d26" stroke-width="4"/>
          <path d="M42 40 L 58 40 M 35 25 L 65 25" stroke="#e0e0e0" stroke-width="4"/>
          <path d="M50 95 C 40 105 60 105 50 95 Z" fill="#FFCC33" stroke="#FFCC33" stroke-width="4" stroke-linejoin="round"/>
          <path d="M50 40 L50 90 M30 65 L45 90 M70 65 L55 90" stroke="#e0e0e0" stroke-width="3"/>
        </svg>
        <div class="brand-title">MASON BADMINTON</div>
        <div class="brand-subtitle">CONNECT</div>
        <div class="loader">
          <div class="loader-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
