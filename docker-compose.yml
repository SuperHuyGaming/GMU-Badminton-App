services:
  # ----------------------------------------------------------------------------
  # Data Stores
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: gmu-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]}) }'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: gmu-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  redis-cache:
    image: redis:7.2-alpine
    container_name: gmu-redis-cache
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_cache_data:/data

  kafka:
    image: apache/kafka:3.7.0
    container_name: gmu-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ----------------------------------------------------------------------------
  # The GMU Mothership (Node + React)
  # ----------------------------------------------------------------------------
  gmu-backend:
    build:
      context: ./server
      dockerfile: ../Dockerfile.api
    container_name: gmu-node-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://mongodb:27017/gmu_social_db?replicaSet=rs0
    depends_on:
      mongodb:
        condition: service_healthy

  gmu-frontend:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
      args:
        - VITE_API_URL=http://localhost:5005
        - VITE_TOURNAMENT_API_URL=http://localhost:8081
    container_name: gmu-react-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - gmu-backend

  # ----------------------------------------------------------------------------
  # Tournament Finder Microservices (Running in background)
  # ----------------------------------------------------------------------------
  scraper-service:
    build:
      context: ./tournament-services/scraper-service
    container_name: gmu-scraper
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - USE_MOCK_DATA=true
    depends_on:
      - redis

  core-service:
    build:
      context: ./tournament-services/core-service
    container_name: gmu-java-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/gmu_tournaments?replicaSet=rs0
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started

  # ----------------------------------------------------------------------------
  # Monitoring & DevOps
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: gmu-prometheus
    restart: unless-stopped
    volumes:
      - ./server/devops/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: gmu-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=secure_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./server/devops/grafana-dashboard.json:/var/lib/grafana/dashboards/grafana-dashboard.json

volumes:
  mongo_data:
  redis_data:
  redis_cache_data:
  kafka_data:
  grafana_data:

