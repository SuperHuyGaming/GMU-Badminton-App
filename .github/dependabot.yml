version: 2
updates:
  # Maintain dependencies for the React frontend
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "SuperHuyGaming"
    labels:
      - "dependencies"
      - "automated"

  # Maintain dependencies for the Node.js backend
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "SuperHuyGaming"
    labels:
      - "dependencies"
      - "automated"

  # Maintain dependencies for the new Search Service
  - package-ecosystem: "npm"
    directory: "/search-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "SuperHuyGaming"
    labels:
      - "dependencies"
      - "automated"

  # Maintain Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    assignees:
      - "SuperHuyGaming"
    labels:
      - "dependencies"
      - "docker"
