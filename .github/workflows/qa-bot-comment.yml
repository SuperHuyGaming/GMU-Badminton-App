name: Auto-Assign QA Reviewer

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  assign-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Assign QA Bot Comment
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Automated QA Pipeline:**\n\nI have successfully detected this Pull Request! The automated QA test suites are spinning up now.\n\n@SuperHuyGaming, I have automatically assigned the **QA Engineer** to review this code because they are the most fit for the role. Please wait for the green checkmarks before merging!'
            });
